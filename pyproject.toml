[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-trading-engine"
version = "0.1.0"
description = "Local paper-trading and medium-frequency research engine foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=23,<26",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
