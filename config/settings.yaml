timezone: Asia/Kolkata
exchange: NSE
default_candle_interval: 5minute
database_path: data/state/paper_trading.sqlite3
logging_path: logs/paper_trading.log
operating_mode: historical_replay
historical_data:
  root: /home/suruchi-pandey/market-data-platform-gpt/data
  equities_subdir: equities
  indices_subdir: indices
  instrument_master: /home/suruchi-pandey/market-data-platform-gpt/data/reference/instruments_nse.csv
  quality:
    duplicate_timestamps: error
    invalid_ohlc: error
    missing_bars: error
paper_broker:
  fill_mode: candle
  intrabar_ambiguity: conservative
  slippage:
    market_bps: 2.0
    stop_market_bps: 3.0
  transaction_cost_bps: 0.0
persistence:
  enabled: true
  database_path: data/state/paper_trading.sqlite
live_market_data:
  provider: zerodha
  exchange: NSE
  mode: full
  stale_after_seconds: 10
  symbols:
    - RELIANCE
  reconnect_max_tries: 10
  reconnect_max_delay: 30
